name: NVIDIA T4
peak_flops:            # FLOP/s
  fp32: 8.1e+12         # CUDA cores; Turing has no TF32, so FP32 matmuls run here too
  fp16: 16.2e+12        # CUDA cores, half2 (2x FP32): elementwise ops in FP16. ASSUMPTION: no NVIDIA document read states it;
                        # implied by 2x FP16 vs FP32 throughput per SM at cc 7.5. 8.1 changes no memory-bound flag (methods 4.4).
  fp16_tensor: 65.0e+12 # tensor cores: matmuls in FP16 only
bandwidth: 320.0e+9     # B/s, GDDR6. NVIDIA product page: '320+ GB/s'; the T4 datasheet is reported as 300 GB/s.
                        # 300 flips only the block at 160M/2048/FP32 (not tested) (methods 4.4).
l2_bytes: 4194304      # 4 MiB
power_cap_w: 70
